# Lint, type-check and test both halves of PatchPilot on every push.
#
# The two jobs are independent and run in parallel: a frontend typo should not
# hide a backend regression behind a job that never got to run.
#
# Live tests stay out of CI by default. `addopts = -m 'not live'` in
# backend/pyproject.toml already excludes anything that hits the network or
# needs real credentials, so the suite here is hermetic. The docker-marked tests
# do run -- ubuntu-latest has a daemon, and both of them skip cleanly if it is
# missing and need no prebuilt image.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The project declares >=3.11; this is what it is developed against.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Ordered cheapest-first, so an unformatted import does not cost four
      # minutes of test time before it is reported.
      - name: Lint
        run: ruff check patchpilot tests

      - name: Type-check
        run: mypy patchpilot

      - name: Test
        run: pytest -q

  frontend:
    name: frontend (tsc, eslint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The production build is the real gate: it catches what neither tsc nor
      # eslint does, and it is how the app is actually served.
      - name: Build
        run: npm run build
